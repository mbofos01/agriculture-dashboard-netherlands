x-wharfmap:
  conditions:
    service_healthy:
      # stroke: "#000000ff"
      stroke-width: "2px"
      stroke-dasharray: "5 5"
      # color: "#000000ff"
  networks:
    web:
      stroke: " #be9302ff"
      stroke-width: "0px"
      stroke-dasharray: "5 5"
      color: "#e4c981ff"


services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management # RabbitMQ with management interface
    ports:
      - "5672:5672" # RabbitMQ port for messaging
      - "15672:15672" # Management interface port (optional)
    healthcheck:
      # Check if RabbitMQ is ready to accept connections
      test: [ "CMD", "rabbitmq-diagnostics", "status" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      # Disable logging
      RABBITMQ_LOGS: "/dev/null"
      RABBITMQ_LOG_LEVEL: "none"
    networks:
      - web
    x-wharfmap:
      color: "#d89e87ff"
      border-color: "#f16026ff"
      border-width: "3px"
      border-style: "solid"

  database:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=infomdss
      - POSTGRES_DB=dashboard
    command: [ "postgres", "-c", "logging_collector=off", "-c", "log_statement=none", "-c", "log_min_messages=fatal" ]
    volumes:
      - db_dashboard-data:/var/lib/postgresql/data/
      - ./database/init_data.sql:/docker-entrypoint-initdb.d/init_data.sql
    container_name: database
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U student -d dashboard'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web
    x-wharfmap:
      color: "#879ad8ff"
      border-color: "#265cf1ff"
      border-width: "3px"
      border-style: "solid"

  extract:
    container_name: extract
    build:
      context: ./ETL/extract # Directory containing the Python Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy # Wait for RabbitMQ to be ready
      transform:
        condition: service_started # Wait for the load service to start
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EXTRACT_SERVICE_NAME=extract
      - TRANSFORM_SERVICE_NAME=transform
      - LOAD_SERVICE_NAME=load
      - SERVER_SERVICE_NAME=server
      - LOAD_QUEUE=load_queue
      - TRANSFORM_QUEUE=transform_queue
      - SERVER_QUEUE=server_queue
    links:
      - rabbitmq
    volumes:
      - ./data:/data
      - ./communication/:/app/communication
    networks:
      - web
    x-wharfmap:
      color: "#87d89fff"
      border-color: "#4fca43ff"
      border-width: "3px"
      border-style: "solid"

  transform:
    container_name: transform
    build:
      context: ./ETL/transform # Directory containing the Python Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy # Wait for RabbitMQ to be ready
      load:
        condition: service_started # Wait for the load service to start
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EXTRACT_SERVICE_NAME=extract
      - TRANSFORM_SERVICE_NAME=transform
      - LOAD_SERVICE_NAME=load
      - SERVER_SERVICE_NAME=server
      - LOAD_QUEUE=load_queue
      - TRANSFORM_QUEUE=transform_queue
      - SERVER_QUEUE=server_queue
    links:
      - rabbitmq
    volumes:
      - ./data:/data
      - ./communication/:/app/communication
    networks:
      - web
    x-wharfmap:
      color: "#d887d8ff"
      border-color: "#ca43bfff"
      border-width: "3px"
      border-style: "solid"

  load:
    container_name: load
    build:
      context: ./ETL/load # Directory containing the Python Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy # Wait for RabbitMQ to be ready
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EXTRACT_SERVICE_NAME=extract
      - TRANSFORM_SERVICE_NAME=transform
      - LOAD_SERVICE_NAME=load
      - SERVER_SERVICE_NAME=server
      - LOAD_QUEUE=load_queue
      - TRANSFORM_QUEUE=transform_queue
      - SERVER_QUEUE=server_queue
    links:
      - rabbitmq
    volumes:
      - ./data:/data
      - ./communication/:/app/communication
    networks:
      - web
    x-wharfmap:
      color: "#ad87d8ff"
      border-color: "#6c43caff"
      border-width: "3px"
      border-style: "solid"

  server:
    container_name: dashboard
    build:
      context: ./dashboard # Directory containing the Python Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy # Wait for RabbitMQ to be ready
      database:
        condition: service_started
      load:
        condition: service_started
      transform:
        condition: service_started
      extract:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EXTRACT_SERVICE_NAME=extract
      - TRANSFORM_SERVICE_NAME=transform
      - LOAD_SERVICE_NAME=load
      - SERVER_SERVICE_NAME=server
      - LOAD_QUEUE=load_queue
      - TRANSFORM_QUEUE=transform_queue
      - SERVER_QUEUE=server_queue
      - DATABASE_URL=postgresql://student:infomdss@database:5432/dashboard
      - DEBUG=0 # 1 for debugging, 0 for production
    ports:
      - 8050:8050
    volumes:
      - ./data:/data
      - ./models/:/models
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - web
    x-wharfmap:
      color: "#d88787ff"
      border-color: "#ca4343ff"
      border-width: "3px"
      border-style: "solid"

  legacy:
    container_name: legacy
    build:
      context: ./legacy # Directory containing the Python Dockerfile
    volumes:
      - ./data:/data
    depends_on:
      database:
        condition: service_healthy
    networks:
      - web
    x-wharfmap:
      color: "#e2cfcfff"
      border-color: "#000000ff"
      border-width: "3px"
      border-style: "solid"
      
volumes:
  data:
  communication:
  db_dashboard-data:

networks:
  web:
    driver: bridge